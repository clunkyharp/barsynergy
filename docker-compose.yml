services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: barsynergy
      POSTGRES_USER: barsynergy
      POSTGRES_PASSWORD: barsynergy
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U barsynergy -d barsynergy"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
