events {}

http {
  server_tokens off;

  upstream next_app {
    server app:3000;
  }

  server {
    listen 80;
    server_name barsynergy.ru www.barsynergy.ru 72.56.1.69.sslip.io;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://barsynergy.ru$request_uri;
    }
  }

  server {
    listen 443 ssl http2;
    server_name www.barsynergy.ru;

    ssl_certificate /etc/letsencrypt/live/barsynergy.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/barsynergy.ru/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    return 301 https://barsynergy.ru$request_uri;
  }

  server {
    listen 443 ssl http2;
    server_name 72.56.1.69.sslip.io;

    ssl_certificate /etc/letsencrypt/live/72.56.1.69.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/72.56.1.69.sslip.io/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    return 301 https://barsynergy.ru$request_uri;
  }

  server {
    listen 443 ssl http2;
    server_name barsynergy.ru;

    ssl_certificate /etc/letsencrypt/live/barsynergy.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/barsynergy.ru/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 12m;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;

    location / {
      proxy_pass http://next_app;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }
  }
}
