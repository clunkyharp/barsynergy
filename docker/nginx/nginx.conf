events {}

http {
  server_tokens off;

  upstream next_app {
    server app:3000;
  }

  # Supported ingress contract:
  # 1. Public traffic enters through one trusted external TLS edge proxy/load balancer.
  # 2. This Nginx instance stays on private HTTP only and must not be exposed directly.
  # 3. The edge proxy provides the client IP in X-Forwarded-For and Nginx appends its hop.
  server {
    listen 80;
    server_name _;

    client_max_body_size 12m;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; object-src 'none'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://s3.twcstorage.ru https://images.unsplash.com https://picsum.photos; font-src 'self' data:; connect-src 'self'" always;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      proxy_pass http://next_app;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }
  }
}
